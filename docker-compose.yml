# 智能域名生成器 + 微信推送服务（NAS / 家庭服务器部署）
#
# 架构：
#   Flask :5001  -> 主服务（生成域名）
#   Bot   :5002  -> 微信扫码登录 + 消息推送（Node.js + wechat-channel）
#
# 用法：
#   1) cp .env.example .env 并填入 OPENAI_API_KEY / WECHAT_BOT_TOKEN
#   2) docker compose pull   (拉预构建镜像)
#      或 docker compose build (本地构建)
#   3) docker compose up -d
#   4) 访问 http://<NAS-IP>:5001
#
# 完整部署文档：docs/deploy/nas-docker.md

services:
  yuming:
    build: .
    image: ghcr.io/adminmtan/yuming:latest
    container_name: yuming
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - WECHAT_BOT_URL=http://yuming-bot:5002
      - WECHAT_BOT_TOKEN=${WECHAT_BOT_TOKEN:-dev-token-change-me}
      - FLASK_ENV=production
    depends_on:
      yuming-bot:
        condition: service_started
    # 可选：挂 docker.sock 让 web 端"在线更新"按钮可用
    # ⚠️  挂 docker.sock = 给容器 root 等价权限，只在你信任镜像时挂
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  yuming-bot:
    build:
      context: ./wechat-bot
      dockerfile: Dockerfile
    image: ghcr.io/adminmtan/yuming-bot:latest
    container_name: yuming-bot
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      - PORT=5002
      - BOT_API_TOKEN=${WECHAT_BOT_TOKEN:-dev-token-change-me}
      - WECHANNEL_STATE_DIR=/data/wechannel
    volumes:
      # 微信登录状态持久化（必须）
      - wechannel-data:/data/wechannel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 注意：微信扫码登录需要在浏览器里看二维码。
    # 如果是远程 NAS，请把 5002 端口通过 VPN 或内网穿透暴露出来（扫码时短暂开放即可），
    # 扫完码后建议关闭公网访问。
    # 完整方案见 docs/deploy/nas-docker.md#微信扫码远程访问方案

volumes:
  wechannel-data:
